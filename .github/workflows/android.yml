name: Build Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-app/**', 'web/index.html', 'web/version.json']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Prepare Capacitor project
        working-directory: android-app
        run: |
          mkdir -p www
          cp ../web/index.html www/index.html
          cp ../web/icon.svg www/icon.svg
          npm install
          npx cap add android
          npx cap sync android
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android --assetPath assets
      - name: Build APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug
      - id: v
        run: echo "V=$(node -p "require('./web/version.json').version")" >> $GITHUB_OUTPUT
      - run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk Hawwil.apk
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.V }}
          name: Hawwil v${{ steps.v.outputs.V }}
          body: "Windows: Hawwil Setup (installer) or Hawwil (portable). Android: Hawwil.apk"
          make_latest: true
          files: Hawwil.apk
